openapi: 3.0.3

info:
  title: NPO Finance Suite API
  version: "1.0.0"
  description: |
    HTTP JSON API for the NPO (Non-Profit Organization) Finance Suite — a
    fund-accounting system that reports under IFRS with the Kenya Shilling (KES)
    as its functional currency.

    The API backs the browser application. Every page fetches its data from an
    `/api/*` endpoint and every write is re-validated on the server, so the
    business rules described here are enforced, not merely advisory.

    ## Conventions

    - **Base path.** All endpoints are served under `/api`.
    - **Success envelope.** Most successful `200` responses pass through a shared
      helper that appends a top-level `locale` object describing the interface
      language and the reporting locale. A handful of endpoints that return
      `201 Created` (and some inline error responses) do not carry `locale`.
    - **Money.** Display amounts are pre-formatted strings (for example
      `"1,234,567"` or `"—"`). Raw numeric amounts on record and row objects are
      numbers as stored.
    - **Errors.** Errors use `{ "error": "<message>" }` with status `403`
      (permission), `404` (not found) or `422` (validation / business-rule
      violation). A `422` raised because an out-of-system authority is required
      also carries `"needsAuthority": true`.
    - **Authorisation.** There is no bearer token. The acting user is resolved
      from the `elog_actor` cookie (the "Act as" switch); `POST /me/act-as` sets
      it. Permissions (prepare vs approve) follow the two-person rule, so an
      action the acting role cannot take returns `403`.

  license:
    name: MIT

servers:
  - url: http://localhost:8090/api
    description: Local development

tags:
  - name: Dashboard
    description: Finance overview and the board pack.
  - name: Period close
    description: Close and reopen accounting periods; the close pack.
  - name: Chart of accounts
    description: The master chart, with CSV import and export.
  - name: General ledger
    description: One account's posted movements, with CSV export.
  - name: Journals
    description: Double-entry journal batches and recurring templates.
  - name: Payables
    description: Supplier bills through approval, scheduling and payment.
  - name: Receivables
    description: Donor claims and invoices, allowances and write-offs.
  - name: Procurement
    description: Requisition to purchase order to goods received to bill.
  - name: Bank reconciliation
    description: Reconcile a cash account's statement against the cash book.
  - name: Statement formats
    description: Bank-statement CSV formats and per-account assignment.
  - name: Asset register
    description: Fixed assets, depreciation, capitalisation and disposals.
  - name: Asset verification
    description: Physical asset count against the register.
  - name: Payroll
    description: The monthly payroll run and staff roster changes.
  - name: Advances
    description: Staff and observer advances against account 1220.
  - name: Programmes
    description: Programmes — the third coding dimension.
  - name: Funds
    description: Fund balances and utilisation.
  - name: Grants
    description: Donor agreements and burn against elapsed time.
  - name: Budgets
    description: Annual budget against posted actuals.
  - name: Donor reports
    description: Financial reports to funders and their languages.
  - name: Cashflow
    description: Thirteen-week cashflow forecast.
  - name: Reports
    description: Core financial statements.
  - name: Settings
    description: Organisation, ledger, users and configuration.
  - name: Internationalisation
    description: Interface languages and translation requests.
  - name: Me
    description: The acting user and the act-as switch.
  - name: Notifications
    description: The notifications feed.
  - name: Search
    description: Global search across records.

components:
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number; clamped to the valid range.
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Search:
      name: q
      in: query
      description: Free-text search.
      required: false
      schema: { type: string }
    Fund:
      name: fund
      in: query
      description: Fund filter, or "All funds".
      required: false
      schema: { type: string, default: All funds }

  schemas:
    Locale:
      type: object
      description: Interface language and reporting-locale envelope, attached to most 200 responses.
      properties:
        code: { type: string, example: en }
        native: { type: string, example: English }
        label: { type: string, example: English (UK) }
        dir: { type: string, enum: [ltr, rtl], example: ltr }
        coverage: { type: number, example: 100 }
        source: { type: boolean }
        fallback: { type: string }
        reporting:
          type: object
          properties:
            locale: { type: string, example: en-KE }
            currency: { type: string, example: KES }
            locked: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable message. }
        needsAuthority:
          type: boolean
          description: Present and true when the refusal is because an out-of-system authority reference is required.

    StatCard:
      type: object
      properties:
        label: { type: string }
        value: { type: string, description: Pre-formatted display value. }
        note: { type: string }

    Tab:
      type: object
      properties:
        label: { type: string }
        count: { type: integer }

    Pagination:
      type: object
      properties:
        total: { type: integer }
        filtered: { type: integer }
        page: { type: integer }
        pages: { type: integer }
        pageSize: { type: integer, example: 10 }

    Message:
      type: object
      description: A write acknowledgement plus the refreshed view of the resource.
      properties:
        message: { type: string }
      additionalProperties: true

    AssetRegister:
      type: object
      description: The asset register as the page draws it, returned by the register read and every successful write.
      additionalProperties: true
      properties:
        period: { type: string }
        kicker: { type: string }
        run: { type: object, additionalProperties: true }
        stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
        tabs: { type: array, items: { type: object } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        disposals: { type: object, additionalProperties: true }
        tie: { type: object, additionalProperties: true }
        capitalise: { type: object, additionalProperties: true }
        uncapitalised: { type: array, items: { type: object } }
        additions: { type: array, items: { type: object } }
        forms: { type: object, additionalProperties: true }
        can: { type: object, additionalProperties: true }
        message: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }

    JournalSubmission:
      type: object
      description: A journal entry as the editor submits it.
      required: [lines]
      properties:
        status:
          type: string
          enum: [Draft, Pending approval]
          default: Draft
        type:
          type: string
          description: Must be a valid journal type (e.g. Standard, Reversing, Allocation).
          default: Standard
        narration:
          type: string
          description: Required once the entry leaves Draft.
        date: { type: string, format: date }
        period: { type: string }
        docLink: { type: string, default: auto }
        memo: { type: string }
        reversalOf:
          type: string
          description: Required when type is "Reversing"; names the posted entry being reversed.
        lines:
          type: array
          minItems: 2
          description: Each line carries exactly one of debit or credit; totals must balance and be non-zero.
          items:
            type: object
            properties:
              code: { type: string }
              desc: { type: string }
              fund: { type: string, default: General Fund }
              program: { type: string, default: Shared services }
              grantRef: { type: string }
              dr: { type: number }
              cr: { type: number }

  responses:
    Forbidden:
      description: The acting role cannot perform this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Validation or business-rule violation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  requestBodies:
    Nos:
      description: A batch of record numbers to act on.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nos]
            properties:
              nos:
                type: array
                items: { type: string }

paths:
  # ---------------------------------------------------------------- Dashboard
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Finance overview
      description: Headline stats, the decision queue, grant burn, fund balances, integrity checks and the recent audit feed.
      responses:
        '200':
          description: The dashboard payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string }
                  subtitle: { type: string }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  queue:
                    type: array
                    items:
                      type: object
                      properties:
                        tone: { type: string, enum: [warn, urgent, calm] }
                        title: { type: string }
                        detail: { type: string }
                        value: { type: string }
                        cta: { type: string }
                        href: { type: string }
                  queueHint: { type: string }
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string }
                        funder: { type: string }
                        program: { type: string }
                        money: { type: string }
                        burnPct: { type: number }
                        elapsed: { type: number }
                        burnLabel: { type: string }
                        paceLabel: { type: string }
                        barColour: { type: string }
                  grantFooter: { type: string }
                  funds:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        value: { type: string }
                        pct: { type: number }
                        colour: { type: string }
                        href: { type: string }
                  fundHint: { type: string }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        note: { type: string }
                        ok: { type: boolean }
                        href: { type: string }
                  activity:
                    type: array
                    items:
                      type: object
                      properties:
                        what: { type: string }
                        meta: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  /dashboard/board-pack:
    get:
      tags: [Dashboard]
      summary: Board pack
      description: A governance summary for the Board of Trustees, without account-level detail.
      responses:
        '200':
          description: The board pack.
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  meta: { type: string }
                  intro: { type: string }
                  headline: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        no: { type: string }
                        name: { type: string }
                        figure: { type: string }
                  risks:
                    type: array
                    items:
                      type: object
                      properties:
                        area: { type: string }
                        note: { type: string }
                        ok: { type: boolean }
                  attention: { type: string }
                  footer: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  # ------------------------------------------------------------- Period close
  /period-close:
    get:
      tags: [Period close]
      summary: Close checklist and overview for a period
      parameters:
        - name: period
          in: query
          description: Period key such as `2026-08`. Defaults to the earliest open period.
          schema: { type: string }
        - name: year
          in: query
          description: Financial year. Defaults to the period's starting year.
          schema: { type: integer }
      responses:
        '200':
          description: The period-close overview (checklist, readiness, totals, history).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  /period-close/{code}/pack:
    get:
      tags: [Period close]
      summary: The close pack for a period
      parameters:
        - name: code
          in: path
          required: true
          description: Period key such as `2026-08`.
          schema: { type: string }
      responses:
        '200':
          description: The assembled close pack (trial balance, statements, schedules, checklist).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  /period-close/{code}/confirm:
    post:
      tags: [Period close]
      summary: Tick or untick a confirmation task
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step: { type: string, description: The checklist step key. }
                done: { type: boolean, default: false }
      responses:
        '200':
          description: The refreshed overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /period-close/{code}/close:
    post:
      tags: [Period close]
      summary: Close (lock) a period
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The period is closed; the refreshed overview is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /period-close/{code}/reopen:
    post:
      tags: [Period close]
      summary: Reopen a closed period
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Kept on the audit log. }
      responses:
        '200':
          description: The period is reopened; the refreshed overview is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # -------------------------------------------------------- Chart of accounts
  /coa:
    get:
      tags: [Chart of accounts]
      summary: The chart of accounts
      responses:
        '200':
          description: Accounts, stats, options and management flags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        level: { type: integer }
                        type: { type: string }
                        normal: { type: string, enum: [Debit, Credit] }
                        statement: { type: string }
                        isHeader: { type: boolean }
                        restriction: { type: string }
                        fund: { type: string }
                        program: { type: string }
                        funder: { type: string }
                        status: { type: string, enum: [Active, Archived] }
                        amount: { type: number }
                  types: { type: array, items: { type: string } }
                  typeLabel: { type: object, additionalProperties: { type: string } }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  archived: { type: integer }
                  canManage: { type: boolean }
                  codeLength: { type: integer }
                  options: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Chart of accounts]
      summary: Create an account
      description: Finance Manager only. The account opens at a zero balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string, default: Expense }
                parent: { type: string }
                restriction: { type: string }
                fund: { type: string }
                program: { type: string }
                grant: { type: string }
                funder: { type: string }
                currency: { type: string }
                postable: { type: boolean }
                reconcile: { type: boolean }
                donorReport: { type: boolean }
                notes: { type: string }
      responses:
        '201':
          description: The created account (no locale envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /coa/export:
    get:
      tags: [Chart of accounts]
      summary: Export the chart as CSV
      parameters:
        - name: type
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: A CSV file (the current filter and search are applied).
          headers:
            X-Row-Count:
              schema: { type: integer }
              description: Number of rows exported.
          content:
            text/csv:
              schema: { type: string, format: binary }

  /coa/import:
    post:
      tags: [Chart of accounts]
      summary: Import accounts from parsed CSV rows
      description: |
        Without `commit` this is a dry run and nothing changes. Committing requires the
        Finance Manager. Balances are never imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items: { type: object, additionalProperties: true }
                mode: { type: string, enum: [update, skip], default: update }
                fileName: { type: string }
                commit: { type: boolean, default: false }
      responses:
        '200':
          description: The dry-run result, or the commit result with a message.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /coa/{code}:
    put:
      tags: [Chart of accounts]
      summary: Update an account
      description: Finance Manager only. The account code is immutable.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /coa/{code}/archive:
    post:
      tags: [Chart of accounts]
      summary: Archive an account
      description: Finance Manager only. Historical postings are retained.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The archived account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ General ledger
  /gl:
    get:
      tags: [General ledger]
      summary: One account's posted movements for a period
      parameters:
        - name: account
          in: query
          description: Account code. Defaults to 5110, falling back to the first postable account.
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Fund' }
        - name: program
          in: query
          schema: { type: string, default: All programmes }
        - name: grant
          in: query
          schema: { type: string, default: All awards }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: The ledger with opening balance, rows, totals and summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: object, additionalProperties: true }
                  filters: { type: object, additionalProperties: true }
                  options: { type: object, additionalProperties: true }
                  openingDate: { type: string }
                  opening: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        fullDate: { type: string }
                        ref: { type: string }
                        narration: { type: string }
                        source: { type: string }
                        fund: { type: string }
                        program: { type: string }
                        grant: { type: string }
                        funder: { type: string }
                        debit: { type: string }
                        credit: { type: string }
                        balance: { type: string }
                  totalDebit: { type: string }
                  totalCredit: { type: string }
                  closing: { type: string }
                  summary: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  awards: { type: array, items: { type: object } }
                  footer: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  /gl/export:
    get:
      tags: [General ledger]
      summary: Export the ledger as CSV
      parameters:
        - name: account
          in: query
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Fund' }
        - name: program
          in: query
          schema: { type: string }
        - name: grant
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: A CSV file for the account and filters shown.
          content:
            text/csv:
              schema: { type: string, format: binary }

  /gl/entry/{ref}:
    get:
      tags: [General ledger]
      summary: The lines of one posted entry
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The entry lines with a balance total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        debit: { type: number }
                        credit: { type: number }
                        debitLabel: { type: string }
                        creditLabel: { type: string }
                  total: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Journals
  /journals:
    get:
      tags: [Journals]
      summary: The journal register
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [All, Draft, Pending approval, Posted, Reversed], default: All }
        - name: type
          in: query
          schema: { type: string, default: All types }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: The filtered, paginated register.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            ref: { type: string }
                            date: { type: string }
                            type: { type: string }
                            narration: { type: string }
                            status: { type: string }
                            fund: { type: string }
                            program: { type: string }
                            grant: { type: string }
                            grantMissing: { type: boolean }
                            lines: { type: integer }
                            amount: { type: string }
                            preparer: { type: string }
                      typeOptions: { type: array, items: { type: string } }
                      tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                      hint: { type: string }
                      footer: { type: string }
                      policy: { type: string }
                      stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                      locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Journals]
      summary: Create a journal
      description: |
        Accepts JSON, or `multipart/form-data` whose `payload` field is the JSON and whose
        `attachments[]` are supporting documents (≤ 10 MB each). Creates a Draft or submits
        for approval. Preparer only. Debits must equal credits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalSubmission' }
          multipart/form-data:
            schema:
              type: object
              properties:
                payload: { type: string, description: JSON per JournalSubmission. }
                'attachments[]':
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: The created journal (no locale envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/form:
    get:
      tags: [Journals]
      summary: Options for the journal editor
      responses:
        '200':
          description: Periods, document series, accounts, funds, programmes and awards.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /journals/recurring:
    get:
      tags: [Journals]
      summary: Recurring templates and entries a template can be built from
      responses:
        '200':
          description: The templates plus recent journals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { type: string }
                  templates: { type: array, items: { type: object, additionalProperties: true } }
                  journals:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string }
                        label: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Journals]
      summary: Create a monthly template from an entry
      description: Preparer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref: { type: string, description: The source journal reference. }
      responses:
        '201':
          description: The new template (no locale envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/recurring/{code}/run:
    post:
      tags: [Journals]
      summary: Generate a template's next entry now
      description: Preparer only. The generated entry still requires approval.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: The generated journal and the refreshed template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: object, additionalProperties: true }
                  template: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/recurring/{code}/toggle:
    post:
      tags: [Journals]
      summary: Pause or resume a template
      description: Preparer only.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The toggled template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/{ref}/attachments/{id}:
    get:
      tags: [Journals]
      summary: Download a journal's supporting document
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The file download.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /journals/{ref}:
    get:
      tags: [Journals]
      summary: One journal
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The full journal object.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Journals]
      summary: Update a draft or pending entry
      description: |
        Same body as create, plus `removeAttachments` (attachment ids to remove).
        Accepts JSON or multipart. Preparer only.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JournalSubmission'
                - type: object
                  properties:
                    removeAttachments:
                      type: array
                      items: { type: integer }
          multipart/form-data:
            schema:
              type: object
              properties:
                payload: { type: string }
                'attachments[]':
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: The updated journal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/{ref}/discard:
    post:
      tags: [Journals]
      summary: Discard a draft
      description: Preparer only. Posted entries are corrected by reversal, never deleted.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The discarded reference.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/{ref}/reverse:
    post:
      tags: [Journals]
      summary: Reverse a posted entry
      description: Preparer only. Raises the linked contra journal and sends it for approval.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: The new reversing journal (no locale envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/{ref}/approve:
    post:
      tags: [Journals]
      summary: Approve and post an entry
      description: Approver only, and not the preparer.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The posted journal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /journals/{ref}/reject:
    post:
      tags: [Journals]
      summary: Reject an entry, returning it to draft
      description: Approver only.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The journal returned to draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journal: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ Payables
  /payables:
    get:
      tags: [Payables]
      summary: The bill register
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [All, Awaiting approval, Approved, Scheduled, Paid, Overdue], default: All }
        - name: age
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Fund' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Bills with ageing, tabs and stats.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            no: { type: string }
                            supplier: { type: string }
                            subtitle: { type: string }
                            invDate: { type: string }
                            dueDate: { type: string }
                            fund: { type: string }
                            program: { type: string }
                            gross: { type: number }
                            wht: { type: number }
                            net: { type: number }
                            status: { type: string }
                            age: { type: string }
                            overdue: { type: boolean }
                      fundOptions: { type: array, items: { type: string } }
                      aging: { type: array, items: { type: object } }
                      tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                      hint: { type: string }
                      footer: { type: string }
                      stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                      locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Payables]
      summary: Capture a supplier bill
      description: Preparer only. The bill posts to the ledger once a second person approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 'A bill-capture object: supplier, PIN, category, invoice number and date, terms, budget line, coded lines and WHT.'
      responses:
        '201':
          description: The captured bill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payables/form:
    get:
      tags: [Payables]
      summary: Options for capturing a bill
      responses:
        '200':
          description: Suppliers, categories, budget lines, methods, terms and rates.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /payables/approve:
    post:
      tags: [Payables]
      summary: Approve bills for payment (batch)
      description: Approver only.
      requestBody: { $ref: '#/components/requestBodies/Nos' }
      responses:
        '200':
          description: The batch outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payables/schedule:
    post:
      tags: [Payables]
      summary: Schedule bills into a payment run (batch)
      description: Preparer or approver.
      requestBody: { $ref: '#/components/requestBodies/Nos' }
      responses:
        '200':
          description: The batch outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payables/pay:
    post:
      tags: [Payables]
      summary: Release payment for bills (batch)
      description: Approver only. High-value releases may require an authority reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nos]
              properties:
                nos: { type: array, items: { type: string } }
                authorityRef: { type: string }
      responses:
        '200':
          description: The payment-run outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation failure, or an authority reference is required (needsAuthority=true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payables/wht-remittance:
    post:
      tags: [Payables]
      summary: Remit withholding tax to KRA
      description: Approver only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                authorityRef: { type: string }
      responses:
        '201':
          description: The remittance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remittance: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payables/{no}:
    get:
      tags: [Payables]
      summary: One bill, with the actions open to the acting user
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The bill and its permitted actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: { type: object, additionalProperties: true }
                  can: { type: object, additionalProperties: true }
                  authorityNote: { type: string }
                  methodOptions: { type: array, items: { type: string } }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payables/{no}/reject:
    post:
      tags: [Payables]
      summary: Reject a bill
      description: Approver only.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The updated bill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payables/{no}/method:
    post:
      tags: [Payables]
      summary: Change how a bill is paid
      description: Preparer or approver.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, example: M-Pesa B2B paybill }
      responses:
        '200':
          description: The updated bill.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- Receivables
  /receivables:
    get:
      tags: [Receivables]
      summary: The invoice register
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [All, Draft, Issued, Part received, Overdue, Received, Written off], default: All }
        - name: age
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Fund' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Invoices with ageing, the allowance card, tabs and stats.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      rows: { type: array, items: { type: object, additionalProperties: true } }
                      fundOptions: { type: array, items: { type: string } }
                      aging: { type: array, items: { type: object } }
                      tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                      hint: { type: string }
                      footer: { type: string }
                      stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                      allowance: { type: object, additionalProperties: true }
                      locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Receivables]
      summary: Build a draft donor claim or other-income invoice
      description: Preparer only. Nothing hits the ledger until it is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: The created invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/form:
    get:
      tags: [Receivables]
      summary: Options for the claim builder
      responses:
        '200':
          description: Awards, other-income accounts, currencies and the due date.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /receivables/statement:
    get:
      tags: [Receivables]
      summary: Aged receivables statement (CSV)
