      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/receive:
    post:
      tags: [Procurement]
      summary: Record goods received
      description: Preparer only.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                receivedBy: { type: string }
