      responses:
        '200':
          description: The count rows, progress and stats.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                  progress: { type: object, additionalProperties: true }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /asset-verification/exceptions:
    get:
      tags: [Asset verification]
      summary: Unresolved count exceptions
      responses:
        '200':
          description: Exceptions with their carrying value and required action.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /asset-verification/{tag}:
    post:
      tags: [Asset verification]
      summary: Record a count result for an asset
      description: |
        The asset tag can contain slashes and is taken as the full trailing path. Any result
        other than "Sighted" requires a note.
      parameters:
        - name: tag
          in: path
          required: true
          description: The full asset tag (may contain slashes, e.g. NPO/IT/0041).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [Sighted, Not found, Condition issue] }
                note: { type: string }
                documents: { $ref: '#/components/schemas/DocumentIds' }
      responses:
        '200':
          description: The recorded result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag: { type: string }
                  result: { type: string }
