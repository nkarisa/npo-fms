                    - type: array
                      items: { type: string }
      responses:
        '200':
          description: The refreshed settings with a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ----------------------------------------------------- Internationalisation
  /i18n:
    get:
      tags: [Internationalisation]
      summary: Languages, coverage, locked terms and formats
      responses:
        '200':
          description: The i18n overview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locales: { type: array, items: { type: object, additionalProperties: true } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /i18n/requests:
    get:
      tags: [Internationalisation]
      summary: The translation request queue
      responses:
        '200':
          description: Requests and the report reasons.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  reasons: { type: array, items: { type: string } }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Internationalisation]
      summary: Raise wording for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [str, locale]
              properties:
                str: { type: string, description: The catalogue string. }
                locale: { type: string, description: Target language (not the source). }
                mode: { type: string, enum: [suggest, report, unlock], default: suggest }
                text: { type: string, description: Required when mode is "suggest". }
                reasons:
                  type: array
                  items: { type: string }
                  description: Required when mode is "report".
                who: { type: string }
      responses:
        '201':
          description: The raised request (no locale envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object, additionalProperties: true }
                  note: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /i18n/requests/{id}/approve:
    post:
      tags: [Internationalisation]
      summary: Approve a translation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object, additionalProperties: true }
                  note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /i18n/requests/{id}/decline:
    post:
      tags: [Internationalisation]
      summary: Decline a translation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object, additionalProperties: true }
                  note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      summary: The acting user and the act-as list
      responses:
        '200':
          description: The current actor, the actors that can be switched to, and the menu.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  me: { type: object, additionalProperties: true }
                  actors: { type: array, items: { type: object, additionalProperties: true } }
                  menu: { type: array, items: { type: object } }
                  note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  /me/act-as:
    post:
      tags: [Me]
      summary: Switch the acting user
      description: Sets the `elog_actor` cookie for 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: The new acting user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  me: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: The notifications feed
      parameters:
        - name: unread
          in: query
          description: When true, only unread notifications are returned.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Notifications with the unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  unread: { type: integer }
                  total: { type: integer }
                  summary: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark a notification read (or all)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: Omit or leave empty to mark all read. }
      responses:
        '200':
          description: The remaining unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- Search
  /search:
    get:
      tags: [Search]
      summary: Global search across records
      parameters:
        - name: q
          in: query
          description: At least two characters; shorter queries return no groups.
          schema: { type: string }
      responses:
        '200':
          description: Grouped search hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  count: { type: integer }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        more: { type: integer }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              ref: { type: string }
                              title: { type: string }
                              sub: { type: string }
                              value: { type: string }
                              href: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
