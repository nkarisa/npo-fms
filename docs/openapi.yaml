      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/rfq:
    post:
      tags: [Procurement]
      summary: Issue a request for quotation
      description: Preparer only.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/purchase-order:
    post:
      tags: [Procurement]
