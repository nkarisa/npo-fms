            schema:
              type: object
              properties:
                mode: { type: string, enum: [refund, outstanding], default: refund }
                receipts:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      desc: { type: string }
                      amount: { type: number }
                documents:
                  $ref: '#/components/schemas/DocumentIds'
                  description: The receipts. Required while `documents.requireAdvanceReceipts` holds.
      responses:
        '200':
          description: The outcome with a verdict and a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- Programmes
  /programmes:
    get:
      tags: [Programmes]
      summary: The programmes list
      parameters:
        - name: filter
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Programmes with budget, burn and the shared-cost allocation banner.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  allocation: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }

  /programmes/{code}:
    get:
      tags: [Programmes]
      summary: One programme
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The programme detail.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------------- Funds
  /funds:
    get:
      tags: [Funds]
      summary: Fund balances
      parameters:
        - name: class
          in: query
          schema: { type: string, enum: [All, Unrestricted, Restricted, Endowment], default: All }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Funds with utilisation, tabs and stats.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Funds]
      summary: Open a fund
      description: |
        Finance Manager only. A fund is the first coding every posting carries, so an
        instance cannot post anything until it has one. The restriction and the ledger
        column have to agree: an endowment is reported as one and rolls up as one, and
        the grant and capital columns report money held for a donor, so a fund in them
        cannot be unrestricted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, restriction, ledgerGroup]
              properties:
                code: { type: string, example: FND-100, description: 2 to 20 letters, digits and hyphens. }
                name: { type: string, example: General Fund }
                restriction: { type: string, enum: [unrestricted, restricted, designated, endowment] }
                ledgerGroup: { type: string, enum: [general, grant, capital, endowment] }
                funder: { type: string, description: A funder already on the register, where the fund holds one donor's money. }
                purpose: { type: string }
                deedRef: { type: string }
                startsOn: { type: string, format: date }
                spendBy: { type: string, format: date }
                conditions: { type: string }
      responses:
        '200':
          description: The fund and the register as it now stands, so the panel redraws without a second call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /funds/{code}:
    get:
      tags: [Funds]
      summary: One fund
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The fund detail.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------------- Grants
  /grants:
    get:
      tags: [Grants]
      summary: Donor agreements
      parameters:
        - name: status
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Grants with value, spend and burn.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Grants]
      summary: Record an award from its agreement
      description: >
        `settings.manage` only. Opens or attaches a fund and writes the award, its
        budget, disbursements, reporting calendar and conditions in one go. An award recorded as
        Active needs its signed agreement in `documents`; a Pipeline award does not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                status: { type: string, enum: [Pipeline, Active] }
                documents: { $ref: '#/components/schemas/DocumentIds' }
      responses:
        '200':
          description: The award reference and a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /grants/{ref}:
    get:
      tags: [Grants]
      summary: One grant
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The grant detail.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
                  documents: { type: array, items: { $ref: '#/components/schemas/Document' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /grants/{ref}/activate:
    post:
      tags: [Grants]
      summary: Convert a pipeline award on signature
      description: >
        `settings.manage` only. The award needs its agreement period, and its budget and
        disbursements must agree with its value. It also needs its signed agreement: already on
        file, or sent here as `documents`.
      parameters:
        - name: ref
          in: path
          required: true
          description: The award reference; slashes are allowed.
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                documents: { $ref: '#/components/schemas/DocumentIds' }
      responses:
        '200':
          description: The award is active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------- Budgets
  /budgets:
    get:
      tags: [Budgets]
      summary: Budget against actual, grouped
      parameters:
        - name: group
          in: query
          schema: { type: string, enum: [Account group, Programme, Fund], default: Account group }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Grouped budget lines with stats.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  groups: { type: array, items: { type: object, additionalProperties: true } }
                  groupOptions: { type: array, items: { type: string } }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  locale: { $ref: '#/components/schemas/Locale' }

  # -------------------------------------------------------------- Donor reports
  /donor-reports:
    get:
      tags: [Donor reports]
      summary: Financial reports to funders
      parameters:
        - name: status
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Reports with whether each ties to the ledger.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /donor-reports/languages:
    get:
      tags: [Donor reports]
      summary: Report language per funder, with a cover preview
      parameters:
        - name: funder
          in: query
          description: Funder name. Defaults to the first funder.
          schema: { type: string }
      responses:
        '200':
          description: The language rows, choices and preview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Donor reports]
      summary: Set the report language for a funder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [funder, locale]
              properties:
                funder: { type: string }
                locale: { type: string, description: A known language code. }
      responses:
        '200':
          description: The updated funder record and preview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /donor-reports/{ref}:
    get:
      tags: [Donor reports]
      summary: One donor report
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The report detail with its lines.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- Cashflow
  /cashflow:
    get:
      tags: [Cashflow]
      summary: Thirteen-week cashflow forecast
      parameters:
        - name: scenario
          in: query
          schema: { type: string, enum: [Base case, Donor delay, By-election surge], default: Base case }
        - name: hold
          in: query
          description: Apply the spending-hold lever.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The weekly forecast rows and stats.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  scenario: { type: string }
                  scenarioOptions: { type: array, items: { type: string } }
                  hold: { type: boolean }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  warning: { type: string }
                  hint: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  # ------------------------------------------------------------------- Reports
  /reports:
    get:
      tags: [Reports]
      summary: A core financial statement
      parameters:
        - name: report
          in: query
          schema:
            type: string
            enum:
              - Statement of financial position
              - Trial balance
              - Statement of activities
              - Statement of cash flows
            default: Statement of financial position
      responses:
        '200':
          description: The selected statement (a trial balance, or grouped sections with totals).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  title: { type: string }
                  sections: { type: array, items: { type: object, additionalProperties: true } }
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  totals: { type: object, additionalProperties: true }
                  balanced: { type: boolean }
                  notes: { type: array, items: { type: string } }
                  locale: { $ref: '#/components/schemas/Locale' }

  # ------------------------------------------------------------------ Settings
  /settings:
    get:
      tags: [Settings]
      summary: The full settings payload
      responses:
        '200':
          description: Organisation, ledger, controls, currencies, approvals, payroll scales, appearance, users, audit and language.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  sections: { type: array, items: { type: object } }
                  canManage: { type: boolean }
                  appearance:
                    type: object
                    description: How the shell is branded and painted — the name it carries, the logo, and the theme.
                    properties:
                      theme: { type: string, example: evergreen }
                      appName: { type: string, example: ELOG }
                      appTagline: { type: string, example: Finance Suite }
                      logo:
                        type: string
                        description: The logo's address, or empty when the sidebar draws the initials instead.
                        example: /api/settings/logo?v=9f2c1ab4de
                      custom:
                        type: object
                        description: The two colours the custom theme is built from; every other shade is derived from them in the stylesheet.
                        properties:
                          accent: { type: string, example: '#0f5c4a' }
                          rail: { type: string, example: '#0d1b18' }
                  funds:
                    type: array
                    description: The funds every posting is coded to, listed on Settings → Segments.
                    items:
                      type: object
                      properties:
                        code: { type: string, example: FND-100 }
                        name: { type: string, example: General Fund }
                        restriction: { type: string, example: Unrestricted }
                        group: { type: string, example: General Fund, description: The ledger column the fund rolls up to. }
                        funder: { type: string, description: The funder the fund is held for, where it holds one donor's money. }
                        status: { type: string, example: Active }
                        purpose: { type: string }
                        postings: { type: integer, description: Posted journal lines coded to this fund. }
                  fundOptions:
                    type: object
                    description: What a new fund may be.
                    properties:
                      restrictions: { type: array, items: { type: string }, example: [Unrestricted, Restricted, Designated, Endowment] }
                      groups: { type: array, items: { type: string }, example: [General Fund, Grant Fund, Capital Fund, Endowment Fund] }
                      funders: { type: array, items: { type: string } }
                  entityTypes:
                    type: array
                    description: What an entity may be. There is exactly one head office.
                    items: { type: string }
                    example: [Head office, Branch, Related trust]
                  themes:
                    type: array
                    description: The themes that may be chosen, in the order the picker lists them.
                    items:
                      type: object
                      properties:
                        key: { type: string, example: deep-blue }
                        name: { type: string, example: Deep blue }
                        note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Settings]
      summary: Save changes
      description: Finance Manager only. Send only the changed sections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Any subset of organisation, entities, ledger, toggles, segments, currencies,
                approvals, payroll, appearance, users, language. The logo is not part of the
                draft — it has its own endpoints. Entities are added and amended here; an
                entity is never removed, because every posting carries the entity it was made
                against, so one that leaves service is made dormant.
      responses:
        '200':
          description: The saved settings with a message and change list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings/logo:
    get:
      tags: [Settings]
      summary: The logo
      description: |
        Served from storage rather than from the document root, so replacing it is a
        settings change rather than a deployment. Sent with nosniff and a content
        security policy, and cached for a day — a new logo is stored under a new
        address, so the cache never serves a stale one.
      responses:
        '200':
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { description: No logo is set; the sidebar draws the initials of the application name. }
    post:
      tags: [Settings]
      summary: Replace the logo
      description: |
        Finance Manager only. PNG, JPEG or WebP under 500 KB — an SVG is refused, since
        it can carry script as well as a picture. Saved as it is chosen rather than with
        the draft, and the logo it replaces is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo: { type: string, format: binary }
      responses:
        '200':
          description: The refreshed settings with a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings/logo/remove:
    post:
      tags: [Settings]
      summary: Remove the logo
      description: Finance Manager only. The sidebar goes back to drawing the initials of the application name.
      responses:
        '200':
          description: The refreshed settings with a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /statement-formats/account:
    post:
      tags: [Settings]
      summary: Open a cash account
      description: |
        Finance Manager only. A reconciliation is between a cash account and the
        statement of the account behind it, so the ledger account comes first: it must
        be a postable asset account, and no two cash accounts may sit on the same one.
        Assign a statement format afterwards before loading a statement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, example: '1110', description: The leaf asset account the cash is held on. }
                name: { type: string, example: KCB Current Account }
                shortName: { type: string, example: KCB Current, description: What the reconciliation and cash book show; the name truncated if left out. }
                kind: { type: string, enum: [bank, mobile_money, petty_cash], default: bank }
                bankName: { type: string, example: KCB }
                accountNumber: { type: string, example: '1104578921' }
                currency: { type: string, example: KES }
      responses:
        '200':
          description: |
            The account, with the formats, the cash accounts and the ledger accounts still
            free to carry one — `candidates` — as they now stand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings/conversion:
    get:
      tags: [Settings]
      summary: What a conversion can be loaded into
      description: |
        Carrying an entity's permanent balances from a legacy system. Answers which
        open periods could take opening balances (only those the ledger holds nothing
        before), the conversion already loaded, and the column headers the reader
        looks for.
      responses:
        '200':
          description: The panel's options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  canManage: { type: boolean, description: Whether this user may load or discard a conversion. }
                  role: { type: string, example: Senior Accountant }
                  currency: { type: string, example: KES, description: Figures are read in the entity's own currency; there is no rate table to translate against. }
                  maxBytes: { type: integer, example: 2097152 }
                  columns:
                    type: object
                    description: The header this reader looks for per field, and the synonyms it also accepts.
                    additionalProperties: { type: string }
                    example: { account: account code, debit: debit, credit: credit, balance: balance }
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: Jan 2025 }
                        starts: { type: string, example: 01 Jan 2025 }
                        cutOff: { type: string, example: 31 Dec 2024, description: The last day the old system is authoritative for. }
                        yearStart: { type: boolean, description: True when a full year ended on the cut-off, so only balance-sheet accounts may carry. }
                        postedBefore: { type: integer, description: Entries already posted on or before the cut-off. Anything but nil blocks a conversion. }
                        carried: { type: string, nullable: true, description: The reference of an opening journal the period already holds. }
                        available: { type: boolean }
                  batch:
                    type: object
                    nullable: true
                    description: The conversion loaded for this entity, if any.
                    properties:
                      period: { type: string, example: Jan 2025 }
                      cutOff: { type: string, example: 31 Dec 2024 }
                      source: { type: string, example: Sage 50 }
                      file: { type: string, example: trial-balance.csv }
                      rows: { type: integer, example: 31 }
                      total: { type: number, example: 12891000 }
                      reference: { type: string, example: OB-25-0001 }
                      status: { type: string, example: Draft }
                      settled: { type: boolean, description: True once the journal has posted, after which the conversion cannot be discarded. }
                      loadedBy: { type: string, example: W. Kamau }
                      loadedAt: { type: string, example: 18 Sep 2026 }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/conversion/template:
    get:
      tags: [Settings]
      summary: The trial balance to fill in
      description: |
        A CSV download carrying exactly the columns the reader looks for, so a file
        built from it loads back with no mapping. Under the header sits the
        organisation's own chart — every postable account with the fund and programme
        code it defaults to, and the figures blank. Where `period` opens the fiscal
        year, income and expenditure are left out: a year that has ended carries its
        result in the accumulated fund. Before a chart is imported the template is
        just its column headings.
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, example: Jan 2026 }
          description: The period the balances would be carried into; it decides the cut-off in the filename and whether income and expenditure are listed.
      responses:
        '200':
          description: The template, as an attachment named for the organisation and the cut-off.
          content:
            text/csv:
              schema: { type: string, format: binary }

  /settings/conversion/preview:
    post:
      tags: [Settings]
      summary: Check a trial balance
      description: |
        Finance Manager only. Reads the file, places every row on the chart and answers
        every rule — and writes nothing at all. The same body serves
        `/settings/conversion/load`, which does this and then writes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: The trial balance as CSV, under 2 MB. }
                period: { type: string, example: Jan 2025, description: The open period the balances are carried into. }
                source: { type: string, example: Sage 50, description: Where the figures came from; recorded on the entry and in the audit log. }
                decimal: { type: string, enum: ['.', ','], description: How the old system wrote its figures. }
      responses:
        '200':
          description: The file as it would be carried, with every check answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings/conversion/load:
    post:
      tags: [Settings]
      summary: Carry the balances
      description: |
        Finance Manager only. Checks the file as `preview` does and, only if every check
        passed, writes the balances as a **draft** journal — never a posting. The draft is
        then submitted and approved on the Journals screen, so the person who loaded the
        conversion cannot also approve it and the approval limits apply. Refused with the
        first failing check where anything does not pass.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                period: { type: string }
                source: { type: string }
                decimal: { type: string, enum: ['.', ','] }
      responses:
        '200':
          description: The file as carried, with the draft entry it became.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Conversion'
                  - type: object
                    properties:
                      committed:
                        type: object
                        properties:
                          reference: { type: string, example: OB-25-0001 }
                          lines: { type: integer, example: 31 }
                          message: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings/conversion/discard:
    post:
      tags: [Settings]
      summary: Discard a conversion
      description: |
        Finance Manager only. Throws the load away and deletes the draft entry with it.
        Refused once the entry has been approved: it is then a posted journal like any
        other, and a mistake is corrected by a further entry. What was attempted stays on
        the record, marked discarded.
      responses:
        '200':
          description: The refreshed panel with a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /settings/invite:
    post:
      tags: [Settings]
      summary: Invite a user
      description: Needs `users.manage`. Emails a link to choose a password, which works for seven days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                roles: { type: array, items: { type: string }, description: One or more role names. `role` (one name) is also accepted. }
                entities:
                  description: '"all" or an array of entity codes. Every role is held at these.'
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
      responses:
        '200':
          description: The refreshed settings with a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ Sign in
  /auth:
    get:
      tags: [Sign in]
      summary: Where this browser is in signing in
      responses:
        '200': { $ref: '#/components/responses/SignInState' }

  /auth/login:
    post:
      tags: [Sign in]
      summary: Email and password
      description: |
        Starts a sign-in. The next `stage` is `done`, `mfa` (an emailed code is sent
        straight away if that is the user's method) or `enrol`. A wrong password
        gets the same refusal whether or not the email has an account; five in a
        row lock the account for 15 minutes. Limited to ten a minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/SignInState' }
        '422': { $ref: '#/components/responses/SignInState' }
        '429':
          description: Too many attempts from this address. Wait a minute.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify:
    post:
      tags: [Sign in]
      summary: The second factor
      description: |
        At `stage: mfa`. A six-digit code from the authenticator app or email, or a
        recovery code (`abcde-fghjk`, used once). Five wrong codes end the sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: '123 456' }
      responses:
        '200': { $ref: '#/components/responses/SignInState' }
        '409': { $ref: '#/components/responses/SignInState' }
        '422': { $ref: '#/components/responses/SignInState' }

  /auth/code:
    post:
      tags: [Sign in]
      summary: Email a new sign-in code
      description: At `mfa` for an email user, or while setting up email at `enrol`. At most one every 30 seconds.
      responses:
        '200': { $ref: '#/components/responses/SignInState' }
        '409': { $ref: '#/components/responses/SignInState' }
        '422': { $ref: '#/components/responses/SignInState' }

  /auth/enrol/start:
    post:
      tags: [Sign in]
      summary: Start setting up a second factor
      description: 'At `stage: enrol`. `totp` returns a secret to scan (needs `encryption.key`); `email` sends a code.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [totp, email] }
      responses:
        '200':
          description: The secret, or confirmation a code was sent, with the sign-in state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignInState'
                  - type: object
                    properties:
                      totp: { $ref: '#/components/schemas/Totp' }
        '409': { $ref: '#/components/responses/SignInState' }
        '422': { $ref: '#/components/responses/SignInState' }

  /auth/enrol/confirm:
    post:
      tags: [Sign in]
      summary: Confirm the factor being set up
      description: Completes the sign-in and returns the recovery codes. They are shown only this once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignInState'
                  - type: object
                    properties:
                      recoveryCodes: { type: array, items: { type: string } }
        '409': { $ref: '#/components/responses/SignInState' }
        '422': { $ref: '#/components/responses/SignInState' }

  /auth/logout:
    post:
      tags: [Sign in]
      summary: Sign out
      responses:
        '200': { $ref: '#/components/responses/SignInState' }

  /auth/forgot:
    post:
      tags: [Sign in]
      summary: Email a password-reset link
      description: Answers the same whether or not the address has an account. The link works for an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/SignInState' }

  /auth/{purpose}:
    parameters:
      - name: purpose
        in: path
        required: true
        schema: { type: string, enum: [invite, reset] }
    get:
      tags: [Sign in]
      summary: Check an invitation or reset link
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Whose link it is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    properties:
                      name: { type: string }
                      email: { type: string }
                      purpose: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [Sign in]
      summary: Choose a password with an invitation or reset link
      description: Uses the link up and begins a sign-in, which continues at `mfa` or `enrol` as the user's settings require.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { $ref: '#/components/responses/SignInState' }
        '422': { $ref: '#/components/responses/SignInState' }

  # ------------------------------------------------------------------ Account
  /account:
    get:
      tags: [Account]
      summary: The signed-in user's account page
      responses:
        '200':
          description: The user, the roles they hold and where, their combined permissions, second-factor state and recent sign-ins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  me: { type: object, additionalProperties: true }
                  access:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string }
                        entities: { type: string, example: All entities }
                  permissions: { type: array, items: { type: string } }
                  mfa: { type: object, additionalProperties: true }
                  activity:
                    type: array
                    items:
                      type: object
                      properties:
                        when: { type: string }
                        what: { type: string }
                        from: { type: string }
                  minLength: { type: integer }
                  locale: { $ref: '#/components/schemas/Locale' }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /account/password:
    post:
      tags: [Account]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: { type: string, format: password }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: The account page with a message. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /account/mfa/start:
    post:
      tags: [Account]
      summary: Start setting up or switching the second factor
      description: Needs the current password. Returns a `totp` secret to scan, or sends an emailed code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, method]
              properties:
                password: { type: string, format: password }
                method: { type: string, enum: [totp, email] }
      responses:
        '200':
          description: The secret or a message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp: { $ref: '#/components/schemas/Totp' }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /account/mfa/confirm:
    post:
      tags: [Account]
      summary: Confirm the new second factor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: The account page with a message and `recoveryCodes`. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /account/mfa/remove:
    post:
      tags: [Account]
      summary: Turn the second factor off
      description: Needs the current password. Refused where the instance requires a second factor of this user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200': { description: The account page with a message. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /account/recovery-codes:
    post:
      tags: [Account]
      summary: Issue new recovery codes
      description: Needs the current password. The old codes stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200': { description: The account page with a message and `recoveryCodes`. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ----------------------------------------------------------- Roles and users
  /roles:
    get:
      tags: [Roles and users]
      summary: The roles, the permission catalogue, and who holds each role
      responses:
        '200':
          description: Roles and catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
                  catalogue:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        group: { type: string }
                  canManage: { type: boolean }
                  locale: { $ref: '#/components/schemas/Locale' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    post:
      tags: [Roles and users]
      summary: Add a role
      description: There is no limit on how many. Names are unique, ignoring case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200': { description: The roles with a message. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /roles/{id}:
    post:
      tags: [Roles and users]
      summary: Change a role's name, description or permissions
      description: |
        Applies at once to everyone holding it. A built-in role keeps its name.
        Refused if it would leave nobody active who can manage users.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200': { description: The roles with a message. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /roles/{id}/delete:
    post:
      tags: [Roles and users]
      summary: Delete a role
      description: Refused for built-in roles, and for a role anyone holds or an approval rule or translation lock names.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: The roles with a message. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /users/{id}/access:
    post:
      tags: [Roles and users]
      summary: Set every role a user holds, and where
      description: |
        Replaces the user's roles. At least one is required. Refused if it would
        leave nobody active who can manage users.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                access:
                  type: array
                  items:
                    type: object
                    required: [role]
                    properties:
                      role: { type: string }
                      entities:
                        description: '"all" (the default) or an array of entity codes.'
                        oneOf:
                          - type: string
                          - type: array
                            items: { type: string }
            example:
              access:
                - { role: Accountant, entities: all }
                - { role: Payroll Reviewer, entities: [ELOG-NS] }
      responses:
        '200': { description: 'The users, roles and audit with a message.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /users/{id}/{action}:
    post:
      tags: [Roles and users]
      summary: Suspend, reinstate, email a set-password link, or reset the second factor
      description: |
        - `suspend`: signs them out and stops them signing in. Not yourself.
        - `reinstate`
        - `invite`: emails a new link to choose a password, to someone who has none yet. Earlier links stop working.
        - `reset-mfa`: removes a lost second factor; they set up a new one at their next sign-in.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [suspend, reinstate, invite, reset-mfa] } }
      responses:
        '200': { description: 'The users, roles and audit with a message.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # -------------------------------------------------------------------- M-Pesa
  /mpesa:
    get:
      tags: [M-Pesa]
      summary: The M-Pesa integration as Settings → Integrations shows it
      description: |
        Credentials are never served. Each is reported as `set` with a `hint` of its
        last four characters; `outstanding` says, per service, what is still missing
        before it can be switched on.
      responses:
        '200':
          description: The integration, the options its selects offer, and the management flag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mpesa:
                    type: object
                    additionalProperties: true
                    properties:
                      environment: { type: string, enum: [sandbox, production] }
                      shortcode: { type: string, description: 'Five to seven digits.' }
                      shortcodeKind: { type: string, enum: [paybill, till] }
                      accountReference: { type: string, description: 'What payers quote on a paybill.' }
                      account: { type: string, description: 'The mobile-money account code it settles to.' }
                      callbackBase: { type: string }
                      initiatorName: { type: string }
                      ceiling: { type: string, description: 'Most one payment may be; at most 250,000.' }
                      collections: { type: boolean }
                      disbursements: { type: boolean }
                      autoMatch: { type: boolean }
                      credentials:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string, enum: [consumerKey, consumerSecret, passkey, securityCredential] }
                            label: { type: string }
                            set: { type: boolean }
                            readable: { type: boolean, description: 'False once the application key has changed under it.' }
                            hint: { type: string, description: 'Masked, e.g. "•••• 4f2a". Never the value.' }
                      callbacks: { type: object, additionalProperties: true, description: 'The addresses to register on the Daraja portal.' }
                      status: { type: object, additionalProperties: true }
                      outstanding: { type: object, additionalProperties: true }
                      checked: { type: object, nullable: true, additionalProperties: true }
                  options: { type: object, additionalProperties: true }
                  canManage: { type: boolean }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [M-Pesa]
      summary: Save the integration
      description: |
        Finance Manager only. Send a credential only when it has been typed — an absent
        one is left as it is held — and name credentials to remove in `clear`. A service
        is refused until everything it needs is set, and payments cannot be switched off
        while bills or advances are already committed to M-Pesa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                environment: { type: string, enum: [sandbox, production] }
                shortcode: { type: string }
                shortcodeKind: { type: string, enum: [paybill, till] }
                accountReference: { type: string }
                account: { type: string, description: 'A mobile-money account code, or "" to clear.' }
                callbackBase: { type: string, description: 'https address Safaricom posts results to.' }
                initiatorName: { type: string }
                ceiling: { type: string }
                collections: { type: boolean }
                disbursements: { type: boolean }
                autoMatch: { type: boolean }
                consumerKey: { type: string, writeOnly: true }
                consumerSecret: { type: string, writeOnly: true }
                passkey: { type: string, writeOnly: true }
                securityCredential: { type: string, writeOnly: true }
                clear:
                  type: array
                  items: { type: string, enum: [consumerKey, consumerSecret, passkey, securityCredential] }
      responses:
        '200':
          description: The integration as it now stands, with a message and the change list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mpesa/check:
    post:
      tags: [M-Pesa]
      summary: Check the connection to Safaricom
      description: |
        Finance Manager only. Asks Daraja for an access token with the credentials held;
        no money moves. What Safaricom answered is recorded against the integration and
        in the audit log.
      responses:
        '200':
          description: What Safaricom answered, with the refreshed integration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      ok: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------- Internationalisation
  /i18n:
    get:
      tags: [Internationalisation]
      summary: Languages, coverage, locked terms and formats
      responses:
        '200':
          description: The i18n overview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locales: { type: array, items: { type: object, additionalProperties: true } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /i18n/requests:
    get:
      tags: [Internationalisation]
      summary: The translation request queue
      responses:
        '200':
          description: Requests and the report reasons.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  reasons: { type: array, items: { type: string } }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Internationalisation]
      summary: Raise wording for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [str, locale]
              properties:
                str: { type: string, description: The catalogue string. }
                locale: { type: string, description: Target language (not the source). }
                mode: { type: string, enum: [suggest, report, unlock], default: suggest }
                text: { type: string, description: Required when mode is "suggest". }
                reasons:
                  type: array
                  items: { type: string }
                  description: Required when mode is "report".
                who: { type: string }
      responses:
        '201':
          description: The raised request (no locale envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object, additionalProperties: true }
                  note: { type: string }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /i18n/requests/{id}/approve:
    post:
      tags: [Internationalisation]
      summary: Approve a translation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object, additionalProperties: true }
                  note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /i18n/requests/{id}/decline:
    post:
      tags: [Internationalisation]
      summary: Decline a translation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { type: object, additionalProperties: true }
                  note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      summary: The signed-in user and the menu
      responses:
        '200':
          description: The current user and the menu. `actors`, the people who can be acted as, only when `auth.actAs` is on.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  me: { type: object, additionalProperties: true }
                  actors: { type: array, items: { type: object, additionalProperties: true } }
                  menu: { type: array, items: { type: object } }
                  note: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  /me/act-as:
    post:
      tags: [Me]
      summary: Switch the acting user (training instances only)
      description: Sets the `elog_actor` cookie for 30 days. Refused with `403` unless `auth.actAs` is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: The new acting user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  me: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: The notifications feed
      parameters:
        - name: unread
          in: query
          description: When true, only unread notifications are returned.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Notifications with the unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  unread: { type: integer }
                  total: { type: integer }
                  summary: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark a notification read (or all)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: Omit or leave empty to mark all read. }
      responses:
        '200':
          description: The remaining unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------- Search
  /search:
    get:
      tags: [Search]
      summary: Global search across records
      parameters:
        - name: q
          in: query
          description: At least two characters; shorter queries return no groups.
          schema: { type: string }
      responses:
        '200':
          description: Grouped search hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  count: { type: integer }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        more: { type: integer }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              ref: { type: string }
                              title: { type: string }
                              sub: { type: string }
                              value: { type: string }
                              href: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
