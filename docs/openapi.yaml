        - name: "no"
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string }
                account: { type: string, default: '1110' }
                ref: { type: string }
                note: { type: string }
      responses:
        '200':
          description: The updated invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/{no}/allowance:
    post:
      tags: [Receivables]
      summary: Set the allowance held against one claim
      description: Approver only.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string, description: 0 to the outstanding balance. }
                reason: { type: string }
      responses:
        '200':
          description: The updated invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- Procurement
  /procurement:
    get:
      tags: [Procurement]
      summary: Requisitions, purchase orders, goods received or suppliers
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [Requisitions, Purchase orders, Goods received, Suppliers], default: Requisitions }
        - name: tab
          in: query
          description: Requisitions view only.
          schema: { type: string, default: Open }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200':
          description: Stats plus the rows for the selected view.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  view: { type: string }
                  views: { type: array, items: { type: string } }
                  threshold: { type: number }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  footer: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
    post:
      tags: [Procurement]
      summary: Raise a requisition (draft)
      description: |
        Requires the `requisition.raise` permission. Accepts JSON, or `multipart/form-data`
        whose `payload` field is the JSON and whose `documents[]` are quotation documents
        (≤ 10 MB each); each quote names its document by index.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          multipart/form-data:
            schema:
              type: object
              properties:
                payload: { type: string }
                'documents[]':
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: The created requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/form:
    get:
      tags: [Procurement]
      summary: Options for a new requisition
      responses:
        '200':
          description: Budget lines, programmes, people, suppliers and the acting user.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /procurement/{no}/documents/{id}:
    get:
      tags: [Procurement]
      summary: Download a quotation document
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The file download.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /procurement/{no}:
    get:
      tags: [Procurement]
      summary: One requisition, with the actions open to the acting user
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The requisition and its permitted actions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  can: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

  /procurement/{no}/submit:
    post:
      tags: [Procurement]
      summary: Submit a requisition for approval
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/approve:
    post:
      tags: [Procurement]
      summary: Approve a requisition
      description: Approver only.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/reject:
    post:
      tags: [Procurement]
