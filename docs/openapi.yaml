          content:
            text/csv:
              schema: { type: string, format: binary }

  /receivables/issue:
    post:
      tags: [Receivables]
      summary: Issue claims to donors (batch)
      description: Approver only.
      requestBody: { $ref: '#/components/requestBodies/Nos' }
      responses:
        '200':
          description: The batch outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/remind:
    post:
      tags: [Receivables]
      summary: Send reminders (batch)
      description: Preparer or approver.
      requestBody: { $ref: '#/components/requestBodies/Nos' }
      responses:
        '200':
          description: The batch outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/receive:
    post:
      tags: [Receivables]
      summary: Record receipt in full (batch)
      description: Preparer or approver.
      requestBody: { $ref: '#/components/requestBodies/Nos' }
      responses:
        '200':
          description: The batch outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/allowance/apply-rates:
    post:
      tags: [Receivables]
      summary: Bring the allowance into line with the ageing rates
      description: Approver only.
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/allowance/rates:
    post:
      tags: [Receivables]
      summary: Save the ageing rates for doubtful debts
      description: Approver only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rates:
                  type: object
                  additionalProperties: { type: number }
                  description: Map of ageing bucket to percentage.
      responses:
        '200':
          description: The saved rates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rates: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

