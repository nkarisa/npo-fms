      tags: [Statement formats]
      summary: Create a statement format
      description: Approver only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The saved format plus the refreshed lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
