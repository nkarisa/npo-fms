      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/approve:
    post:
      tags: [Procurement]
      summary: Approve a requisition
      description: Approver only.
      parameters:
        - name: "no"
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

