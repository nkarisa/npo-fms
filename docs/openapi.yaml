      responses:
        '200':
          description: The updated requisition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requisition: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /procurement/{no}/bill:
    post:
      tags: [Procurement]
      summary: Raise a supplier bill from a requisition
