      summary: Approve and post a disposal
      description: Approver only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: { type: string }
      responses:
        '200':
          description: The refreshed register with a message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetRegister' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------- Asset verification
  /asset-verification:
    get:
      tags: [Asset verification]
      summary: The physical count against the register
      parameters:
        - name: location
          in: query
          schema: { type: string, default: All locations }
        - name: filter
          in: query
          schema: { type: string, default: All }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: The count rows, progress and stats.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  tabs: { type: array, items: { $ref: '#/components/schemas/Tab' } }
                  progress: { type: object, additionalProperties: true }
                  stats: { type: array, items: { $ref: '#/components/schemas/StatCard' } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /asset-verification/exceptions:
    get:
      tags: [Asset verification]
      summary: Unresolved count exceptions
      responses:
        '200':
          description: Exceptions with their carrying value and required action.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  rows: { type: array, items: { type: object, additionalProperties: true } }
                  locale: { $ref: '#/components/schemas/Locale' }

  /asset-verification/{tag}:
    post:
      tags: [Asset verification]
      summary: Record a count result for an asset
      description: |
        The asset tag can contain slashes and is taken as the full trailing path. Any result
        other than "Sighted" requires a note.
      parameters:
        - name: tag
          in: path
          required: true
          description: The full asset tag (may contain slashes, e.g. NPO/IT/0041).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [Sighted, Not found, Condition issue] }
                note: { type: string }
      responses:
        '200':
          description: The recorded result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag: { type: string }
                  result: { type: string }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

