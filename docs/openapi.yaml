  # -------------------------------------------------------- Bank reconciliation
  /bank-rec:
    get:
      tags: [Bank reconciliation]
      summary: The reconciliation for an account and period
      parameters:
        - name: account
          in: query
          description: Cash account code. Falls back to the first account.
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The reconciliation view (statement, cash book, reconciliation statement).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '404':
          description: No statement is loaded, or the target could not be resolved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      canUpload: { type: boolean }
                      role: { type: string }

  /bank-rec/import:
    get:
      tags: [Bank reconciliation]
      summary: Options for uploading a statement
      responses:
        '200':
          description: Accounts, formats and open periods.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [Bank reconciliation]
      summary: Preview or load a statement CSV
      description: |
        Preparer only. `multipart/form-data` with a `file` (the CSV) and a `payload` JSON
        string. When `commit` is false the response is a preview; when true the statement
        is loaded and the refreshed reconciliation returned.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                payload:
                  type: string
                  description: 'JSON: {account, period, reference?, opening?, closing?, entries?, commit?}'
      responses:
        '200':
          description: A preview, or the loaded reconciliation with a message.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /bank-rec/match:
    post:
      tags: [Bank reconciliation]
      summary: Match statement lines to cash-book postings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, period]
              properties:
                account: { type: string }
                period: { type: string }
                statement: { type: array, items: { type: integer } }
                book: { type: array, items: { type: integer } }
      responses:
        '200':
          description: The refreshed reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /bank-rec/unmatch:
    post:
      tags: [Bank reconciliation]
      summary: Undo a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, period, line]
              properties:
                account: { type: string }
                period: { type: string }
                line: { type: integer }
      responses:
        '200':
          description: The refreshed reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /bank-rec/auto-match:
    post:
      tags: [Bank reconciliation]
      summary: Auto-match on exact amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, period]
              properties:
                account: { type: string }
                period: { type: string }
      responses:
        '200':
          description: The refreshed reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /bank-rec/journalise:
    post:
      tags: [Bank reconciliation]
      summary: Raise a journal for a bank-only entry
      description: Preparer only. The entry goes for approval in Journals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, period, line]
              properties:
                account: { type: string }
                period: { type: string }
                line: { type: integer }
      responses:
        '200':
          description: The refreshed reconciliation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /bank-rec/complete:
    post:
      tags: [Bank reconciliation]
      summary: Sign off the reconciliation
      description: Approver only. Requires a nil difference and all lines matched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, period]
              properties:
                account: { type: string }
                period: { type: string }
      responses:
        '200':
          description: The refreshed reconciliation.
          content:
