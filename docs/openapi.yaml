          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { type: object, additionalProperties: true }
                  locale: { $ref: '#/components/schemas/Locale' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /receivables/{no}/recovery:
