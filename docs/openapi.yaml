              schema:
                type: object
                properties:
                  invoice: { type: object, additionalProperties: true }
                  can: { type: object, additionalProperties: true }
                  receiptAccounts: { type: array, items: { type: object } }
                  locale: { $ref: '#/components/schemas/Locale' }
        '404': { $ref: '#/components/responses/NotFound' }

