# Services the application talks to while it is being developed, on one network
# of their own. ./server.sh starts what .env points at; to run them by hand:
#
#   docker compose up -d mailpit     # start
#   docker compose down              # stop and remove (the network too)
#
# Mailpit catches every message the application sends — invitations, password
# resets, sign-in codes — and shows them at http://localhost:8025. Nothing is
# delivered to a real address, whoever the message is to. .env points at it with
# email.SMTPHost = localhost and email.SMTPPort = 1025.
#
# The PHP server runs on this machine (./server.sh), so it reaches Mailpit through
# the published ports. A container joining the fms-dev network reaches it as
# mailpit:1025.

name: fms

services:
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: fms-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP, what the application sends to
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"     # the inbox, in a browser
    environment:
      MP_MAX_MESSAGES: 1000
      # Accept any username and password, so .env can carry them or not.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit-data:/data
    command: ["--database", "/data/mailpit.db"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fms-dev

networks:
  fms-dev:
    name: fms-dev

volumes:
  mailpit-data:
